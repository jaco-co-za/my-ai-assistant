services:
  sonja-file-ui:
    container_name: sonja-file-ui
    build:
      context: .
      args:
        VITE_PORT: "${VITE_PORT:-5188}"
        VITE_FILE_SERVICE_URL: "${VITE_FILE_SERVICE_URL:-http://localhost:3224}"
        VITE_FILE_SERVICE_AUTH: "${VITE_FILE_SERVICE_AUTH:-}"
        VITE_SONJA_PROMPT_PREFIX: "${VITE_SONJA_PROMPT_PREFIX:-sonja file}"
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "0.0.0.0:${VITE_PORT:-5188}:5188"
    networks:
      - ai-assistant-network

networks:
  ai-assistant-network:
    name: ai-assistant-network
    external: true
